<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lista de Chamados</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d2a3a">
</head>

<body>
  <header><strong>SUPPORTED</strong><span class="demo">BETA</span>
    <nav id="nav"></nav><span id="who" style="margin-left:auto;font-size:.85rem"></span>
  </header>
  <main id="m" tabindex="-1" aria-live="polite"></main>
  <script>
    let TK = localStorage.tk || '', ME = null, TAB = 'list'; const can = k => !!ME && ME.perms.includes(k); const $ = s => document.querySelector(s), M = $('#m');
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    async function api(p, o = {}) { const r = await fetch('/api' + p, { ...o, headers: { 'x-token': TK, 'content-type': 'application/json' }, body: o.body ? JSON.stringify(o.body) : undefined }); const j = await r.json(); if (!r.ok) throw Error(j.erro || 'Falha'); return j }
    async function boot() {
      if (!TK) return login(); try { ME = await api('/me') } catch (e) { localStorage.removeItem('tk'); TK = ''; return login(e instanceof TypeError ? 'Não foi possível falar com o servidor. Confirme que o node server.js está rodando e abra http://localhost:3000 (não o arquivo direto).' : e.message == 'Não autorizado.' ? 'Token inválido. Use exatamente demo-admin ou demo-atendente, em minúsculas.' : e.message) } $('#who').textContent = ME.nome;
      const t = [['list', 'Chamados', 'chamados.ver'], ['new', 'Novo', 'chamados.criar'], ['dash', 'Painel', 'painel.ver'], ['imp', 'Importar', 'importar.usar'], ['cfg', 'Configurações']].filter(x => x[0] == 'cfg' ? ['clientes.gerenciar', 'status.gerenciar', 'funcionarios.gerenciar', 'perfis.gerenciar', 'config.gerenciar'].some(can) : can(x[2])); if (!t.some(x => x[0] == TAB)) TAB = t[0] ? t[0][0] : 'list';
      $('#nav').innerHTML = t.map(([k, l]) => `<button data-k="${k}" aria-current="${k == TAB}">${l}</button>`).join(''); $('#nav').onclick = e => { if (e.target.dataset.k) { TAB = e.target.dataset.k; boot() } };
      ({ list, new: nw, dash, imp, cfg })[TAB]()
    }
    async function login(e = '') {
      let c = {}; try { c = await (await fetch('/api/config/public')).json() } catch { e = e || 'Não foi possível falar com o servidor.' }
      M.innerHTML = `<h1>Entrar</h1><p class="err" role="alert">${esc(e)}</p><div class="card"><b>Conta Google</b><p><label><input type="radio" name="gm" value="login" checked style="width:auto"> Já tenho cadastro</label><label><input type="radio" name="gm" value="signup" style="width:auto"> Quero me cadastrar (o administrador precisa aprovar)</label></p><div id="g">${c.googleClientId ? '' : '<p class="err">Login Google não configurado: falta GOOGLE_CLIENT_ID no servidor.</p>'}</div><p id="gm" role="status"></p></div>
<div class="card"><b>Acesso de demonstração</b><label for="t">Token (demo-admin ou demo-atendente)</label><input id="t" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"><p><button class="p" id="go">Entrar com token</button></p></div>`;
      $('#go').onclick = () => { TK = $('#t').value.trim().toLowerCase(); localStorage.tk = TK; boot() };
      if (c.googleClientId) { const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.onload = () => { google.accounts.id.initialize({ client_id: c.googleClientId, callback: async r => { const x = await fetch('/api/auth/google', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ credential: r.credential, mode: document.querySelector('[name=gm]:checked').value }) }), j = await x.json(); if (x.ok && j.token) { TK = j.token; localStorage.tk = TK; boot() } else $('#gm').textContent = j.erro || j.mensagem } }); google.accounts.id.renderButton($('#g'), { theme: 'outline', size: 'large', locale: 'pt-BR' }) }; document.head.appendChild(sc) }
    }
    const card = t => `<article class="card ${t.priority == 'Urgente' ? 'urg' : ''}"><strong>${esc(t.title)}</strong> <span class="tag">${esc(t.status)}</span> ${t.priority == 'Urgente' ? '<span class="tag u">URGENTE</span>' : ''}<br><small>${esc(t.id)} ${t.externalId ? '· OS ' + esc(t.externalId) : ''} · ${esc(t.client || 'sem cliente')} · ${esc(t.owner || 'sem responsável')} · ${new Date(t.openedAt).toLocaleDateString('pt-BR')}</small>${t.urgentReason ? `<br><small><b>${esc(t.urgentReason)}</b> — priorizar correção definitiva.</small>` : ''}<br><button class="s" data-id="${t.id}">Abrir</button></article>`;
    async function list() {
      const sl = await api('/statuses?all=1'); M.innerHTML = `<h1>Chamados</h1><div class="row"><div><label for="q">Buscar</label><input id="q"></div><div><label for="st">Status</label><select id="st"><option value="">Todos</option>${sl.map(x => `<option>${esc(x.nome)}</option>`).join('')}</select></div><div><label for="ow">Responsável</label><input id="ow"></div><div><label for="cl">Cliente</label><input id="cl"></div><div><label for="rc">Somente recorrentes</label><select id="rc"><option value="">Não</option><option value="1">Sim</option></select></div></div><div id="r" role="status">Carregando…</div>`;
      const run = async () => {
        const q = new URLSearchParams({ q: $('#q').value, status: $('#st').value, owner: $('#ow').value, client: $('#cl').value, recurrent: $('#rc').value }); for (const [k, v] of [...q]) if (!v) q.delete(k);
        try { const l = await api('/tickets?' + q); $('#r').innerHTML = l.length ? l.slice(0, 200).map(card).join('') : '<p>Nenhum chamado encontrado. Ajuste os filtros ou importe a planilha.</p>' } catch (e) { $('#r').innerHTML = `<p class="msg e">${e.message}</p>` }
      };
      M.querySelectorAll('input,select').forEach(i => i.oninput = run); run(); $('#r').onclick = e => { if (e.target.dataset.id) detail(e.target.dataset.id) }
    }
    async function detail(id) {
      const t = (await api('/tickets?q=' + id)).find(x => x.id == id), [us, ss, cs] = await Promise.all([api('/users'), api('/statuses'), api('/clients')]);
      const ed = can('chamados.editar'), as = can('chamados.atribuir'), sp = can('chamados.status'), cm = can('chamados.comentar'), ex = can('chamados.excluir'), opt = (l, c) => [...new Set([...l, c].filter(Boolean))].map(n => `<option ${n == c ? 'selected' : ''}>${esc(n)}</option>`).join('');
      const F = [['title', 'Título', 't', ed], ['client', 'Cliente', 'c', ed], ['whatsapp', 'WhatsApp', 't', ed], ['email', 'E-mail', 't', ed], ['owner', 'Responsável', 'u', as], ['team', 'Equipe/fila', 't', as], ['status', 'Status', 's', sp], ['priority', 'Prioridade', 't', ed], ['sentToDev', 'Enviado ao DEV', 'b', ed]], L = [['description', 'Descrição', ed], ['solution', 'Solução aplicada', ed], ['notes', 'Observações internas', ed]];
      const ctl = ([k, l, ty, ok]) => { const d = ok ? '' : 'disabled', v = t[k]; return `<div><label for="f_${k}">${l}</label>` + (ty == 't' ? `<input id="f_${k}" value="${esc(v)}" ${d}>` : ty == 'b' ? `<select id="f_${k}" ${d}><option value="">Não</option><option value="1" ${v ? 'selected' : ''}>Sim</option></select>` : `<select id="f_${k}" ${d}>${ty == 's' ? '' : '<option value="">—</option>'}${opt(ty == 'c' ? cs.map(x => x.nome) : ty == 'u' ? us.map(x => x.nome) : ss.map(x => x.nome), v)}</select>`) + '</div>' };
      const tl = t.timeLog || [], act = tl.find(x => !x.end), tot = () => tl.reduce((n, x) => n + (new Date(x.end || Date.now()) - new Date(x.start)), 0), fm = ms => { const q = Math.max(0, Math.floor(ms / 1e3)); return [Math.floor(q / 3600), Math.floor(q % 3600 / 60), q % 60].map(n => String(n).padStart(2, '0')).join(':') }, at = can('chamados.atender');
      const podeSalvar = [...F.map(x => x[3]), ...L.map(x => x[2]), cm].some(Boolean);
      M.innerHTML = `<button class="s" id="b">Voltar</button><h1>${esc(t.title)}</h1>${card(t).replace(/<button.*<\/button>/, '')}<div class="card"><div class="row">${F.map(ctl).join('')}</div>${L.map(([k, l, ok]) => `<label for="f_${k}">${l}</label><textarea id="f_${k}" rows="3" ${ok ? '' : 'disabled'}>${esc(t[k])}</textarea>`).join('')}
<label for="rs">Motivo (obrigatório ao encerrar, reabrir ou excluir)</label><input id="rs" ${sp || ex ? '' : 'disabled'}>${cm ? `<label for="cm">Comentário</label><textarea id="cm" rows="2"></textarea><label><input type="checkbox" id="vis" style="width:auto"> Visível ao solicitante (vai para a fila de WhatsApp)</label>` : ''}
<p>${podeSalvar ? '<button class="p" id="sv">Salvar alterações</button> ' : ''}${ex ? '<button class="s" id="del">Excluir chamado</button>' : ''}${podeSalvar || ex ? '' : 'Você tem acesso somente para visualização.'}</p><div id="o2" role="status"></div></div>
${at || tl.length ? `<div class="card"><b>Tempo de atendimento</b><div class="kpi" id="tm" aria-label="Tempo total de atendimento">${fm(tot())}</div><small>${act ? 'Em andamento por ' + esc(act.who) + ' desde ' + new Date(act.start).toLocaleTimeString('pt-BR') : 'Cronômetro parado'}</small><p>${at && !act ? '<button class="p" id="tstart">Iniciar atendimento</button>' : ''}${at && act && (act.who == ME.nome || can('chamados.editar')) ? '<button class="p" id="tstop">Finalizar atendimento</button>' : ''}</p><div id="tmo" role="status"></div>${tl.length ? `<div class="scroll"><table><tr><th>Quem</th><th>Início</th><th>Duração</th></tr>${tl.slice().reverse().map(x => `<tr><td>${esc(x.who)}</td><td>${new Date(x.start).toLocaleString('pt-BR')}</td><td>${x.end ? fm(new Date(x.end) - new Date(x.start)) : 'em andamento'}</td></tr>`).join('')}</table></div>` : ''}</div>` : ''}
<div class="card"><b>Comentários</b>${t.comments.map(c => `<p>${c.visibleToRequester ? '<span class="tag">ao solicitante</span>' : '<span class="tag">interno</span>'} ${esc(c.who)}: ${esc(c.text)}</p>`).join('') || '<p>Sem comentários.</p>'}</div>`;
      clearInterval(window._tm); if (act) window._tm = setInterval(() => { const n = $('#tm'); if (!n) return clearInterval(window._tm); n.textContent = fm(tot()) }, 1000);
      for (const [bt, ac] of [['#tstart', 'start'], ['#tstop', 'stop']]) if ($(bt)) $(bt).onclick = async () => { try { await api('/tickets/' + id + '/timer', { method: 'POST', body: { action: ac } }); detail(id) } catch (e) { $('#tmo').innerHTML = `<p class="msg e">${esc(e.message)}</p>` } };
      const er = e => $('#o2').innerHTML = `<p class="msg e">${esc(e.message || e)}</p>`; $('#b').onclick = boot;
      if ($('#sv')) $('#sv').onclick = async () => {
        const b = { reason: $('#rs').value }; F.forEach(([k, , ty, ok]) => { if (ok) b[k] = ty == 'b' ? !!$('#f_' + k).value : $('#f_' + k).value }); L.forEach(([k, , ok]) => { if (ok) b[k] = $('#f_' + k).value }); if (cm && $('#cm').value) { b.comment = $('#cm').value; b.visibleToRequester = $('#vis').checked }
        try { await api('/tickets/' + id, { method: 'PATCH', body: b }); detail(id) } catch (e) { er(e) }
      };
      if ($('#del')) $('#del').onclick = async () => { if (!$('#rs').value.trim()) return er('Informe o motivo da exclusão no campo Motivo.'); if (!confirm('Excluir o chamado ' + id + '? Ele sai da lista, mas fica guardado no backup dos dados.')) return; try { await api('/tickets/' + id, { method: 'DELETE', body: { reason: $('#rs').value } }); TAB = 'list'; boot() } catch (e) { er(e) } }
    }
    async function nw() {
      const [us, cs, ss] = await Promise.all([api('/users'), api('/clients'), api('/statuses')]);
      M.innerHTML = `<h1>Novo chamado</h1><div class="card"><label for="a1">Título</label><input id="a1"><label for="a2">Descrição</label><textarea id="a2" rows="4"></textarea><div class="row"><div><label for="a3">Cliente</label><select id="a3"><option value="">— selecione —</option>${cs.map(c => `<option value="${esc(c.nome)}" data-w="${esc(c.whatsapp)}">${esc(c.nome)}</option>`).join('')}</select>${cs.length ? '' : '<small class="err">Nenhum cliente cadastrado. Cadastre em Configurações.</small>'}</div><div><label for="a4">Responsável</label><select id="a4"><option value="">— sem responsável —</option>${us.map(u => `<option>${esc(u.nome)}</option>`).join('')}</select>${us.length ? '' : '<small class="err">Nenhum funcionário cadastrado. Cadastre em Configurações.</small>'}</div><div><label for="a6">Status</label><select id="a6">${ss.map(x => `<option>${esc(x.nome)}</option>`).join('')}</select></div><div><label for="a5">WhatsApp (com DDD)</label><input id="a5" inputmode="tel"></div></div><p><button class="p" id="sv">Criar chamado</button></p><div id="o"></div></div>`;
      $('#a3').onchange = e => { $('#a5').value = e.target.selectedOptions[0].dataset.w || $('#a5').value };
      $('#sv').onclick = async () => { try { const t = await api('/tickets', { method: 'POST', body: { title: $('#a1').value, description: $('#a2').value, client: $('#a3').value, owner: $('#a4').value, status: $('#a6').value, whatsapp: $('#a5').value.replace(/[^\d+]/g, '') } }); $('#o').innerHTML = `<p class="msg">Chamado ${t.id} criado.${t.recurrent ? ' <b>Atenção: ' + esc(t.urgentReason) + '. Marcado como urgente.</b>' : ''}</p>` } catch (e) { $('#o').innerHTML = `<p class="msg e">${e.message}</p>` } }
    }
    async function dash() {
      const d = await api('/dashboard'), k = (n, l) => `<div class="card"><div class="kpi">${n}</div>${l}</div>`;
      const bars = (it, c0) => { const m = Math.max(1, ...it.map(x => x.v)); return it.length ? `<div role="list">${it.map(x => `<div role="listitem" style="margin:.4rem 0"><div style="display:flex;justify-content:space-between;gap:.5rem"><span>${esc(x.l)}</span><b>${x.v}</b></div><div style="background:#e4eaf0;border-radius:4px;height:14px"><div style="width:${x.v / m * 100}%;background:${x.c || c0 || 'var(--brand)'};height:100%;border-radius:4px"></div></div></div>`).join('')}</div>` : '<p>Sem dados para exibir.</p>' };
      const stack = it => { const m = Math.max(1, ...it.map(x => x.retidos + x.dev)); return it.length ? it.map(x => `<div style="margin:.5rem 0"><div style="display:flex;justify-content:space-between;gap:.5rem"><span>${esc(x.nome)}</span><span><b>${x.retidos}</b> no suporte · <b>${x.dev}</b> com o desenvolvimento</span></div><div style="display:flex;background:#e4eaf0;border-radius:4px;height:14px;width:${(x.retidos + x.dev) / m * 100}%;overflow:hidden"><div style="flex:${x.retidos};background:var(--brand)"></div><div style="flex:${x.dev};background:var(--warn)"></div></div></div>`).join('') : '<p>Sem chamados abertos.</p>' };
      const S = d.sla, R = d.retencao, V = d.devParados, T = d.tempo;
      M.innerHTML = `<h1>Painel</h1><div class="row">${k(d.abertos, 'Abertos')}${k(d.resolvidos, 'Resolvidos')}${k(d.devs, 'Encaminhados ao desenvolvimento')}${k(d.recorrentesAbertos, 'Recorrentes abertos (urgentes)')}${k(S.estourados, 'Abertos com SLA estourado')}${k(R.pct == null ? '—' : R.pct + '%', 'Retenção do time (' + R.retidos + ' de ' + R.abertos + ' abertos)')}${k(T.mediaMin == null ? '—' : T.mediaMin + ' min', 'Tempo médio de atendimento (' + T.chamados + ' chamados com tempo registrado)')}${k(d.taxaSemDev.pct == null ? '—' : d.taxaSemDev.pct + '%', 'Resolução pelo suporte sem desenvolvimento (' + d.taxaSemDev.num + ' de ' + d.taxaSemDev.den + ' resolvidos)')}</div>
<div class="row" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
<section class="card"><h2>SLA de resolução</h2>${bars([{ l: 'Abertos no prazo', v: S.abertosNoPrazo, c: 'var(--ok)' }, { l: 'Abertos com SLA estourado', v: S.estourados, c: 'var(--warn)' }, { l: 'Resolvidos no prazo', v: S.resolvidosNoPrazo, c: 'var(--brand)' }, { l: 'Resolvidos fora do prazo', v: S.resolvidosFora, c: '#8a3b12' }, { l: 'Sem SLA ou sem data de resolução', v: S.semSla, c: '#8a96a3' }])}${S.pior.length ? `<p><b>Mais atrasados ainda abertos</b></p>${S.pior.map(x => `<small>${esc(x.id)} · ${esc(x.title)} · ${x.horas} h de atraso</small><br>`).join('')}` : ''}</section>
<section class="card"><h2>Chamados com mais recorrência</h2>${bars(d.recorrencia.map(x => ({ l: x.titulo + ' (' + x.abertos + ' abertos)', v: x.total })), 'var(--warn)')}</section>
<section class="card"><h2>Parados com o desenvolvimento</h2><p><b>${V.parados}</b> de ${V.total} com mais de ${V.limiteDias} dias desde o encaminhamento.</p>${bars(V.faixas.map(x => ({ l: x.faixa, v: x.total })))}${V.maisAntigos.map(x => `<small>${esc(x.id)} · ${esc(x.title)} · ${x.dias} dias</small><br>`).join('')}</section>
<section class="card"><h2>Retenção do time por responsável</h2>${stack(R.porResponsavel)}</section></div>
<p><small>Fórmulas: <b>SLA</b> = abertura + prazo da prioridade (horas corridas, valores de exemplo; sem horário de atendimento, feriados ou pausas). Resolvido conta fora do prazo se a resolução passou do vencimento. <b>Retenção</b> = abertos não encaminhados ao desenvolvimento ÷ total de abertos. <b>Parado com o desenvolvimento</b> = dias desde o último encaminhamento registrado (ou desde a abertura, se veio de importação). <b>Recorrência</b> = grupos de chamados semelhantes. <b>Resolução sem desenvolvimento</b> = resolvidos sem encaminhamento ÷ total de resolvidos; chamados abertos não entram.</small></p>`}
    function imp() {
      M.innerHTML = `<h1>Importar planilha</h1><p>No Google Sheets: Arquivo → Baixar → CSV. A planilha original não é alterada.</p><input type="file" id="f" accept=".csv,.tsv,.txt"><div id="o"></div>`; let csv = '', map = null;
      const show = async () => {
        try {
          const p = await api('/import/preview', { method: 'POST', body: { csv, map } }); map = p.mapa; const opts = ['', ...p.campos];
          $('#o').innerHTML = `<h2>Mapeamento</h2><div class="scroll"><table><tr><th>Coluna</th><th>Campo do sistema</th></tr>${p.colunas.map((c, i) => `<tr><td>${esc(c) || '(sem nome)'} (col ${i + 1})</td><td><select data-i="${i}" aria-label="Campo para ${esc(c)}">${opts.map(o => `<option ${o == map[i] ? 'selected' : ''} value="${o}">${o || '— não importar —'}</option>`).join('')}</select></td></tr>`).join('')}</table></div><p>Sem destino: ${p.semDestino.map(esc).join(', ') || 'nenhuma'}. Total: ${p.total} · com problemas: ${p.problemas}.</p><div class="scroll"><table><tr><th>Linha</th><th>ID/OS</th><th>Cliente</th><th>Problemas</th></tr>${p.amostra.filter(x => x.problemas.length).slice(0, 50).map(x => `<tr><td>${x.linha}</td><td>${esc(x.dados.externalId)}</td><td>${esc(x.dados.client)}</td><td class="err">${x.problemas.join('; ')}</td></tr>`).join('')}</table></div><p><button class="p" id="ok">Confirmar importação (${p.total - p.problemas} registros)</button></p><div id="rel"></div>`;
          $('#o').querySelectorAll('select').forEach(s => s.onchange = () => { map[s.dataset.i] = s.value; show() }); $('#ok').onclick = async () => { if (!confirm('Importar os registros válidos?')) return; try { const r = await api('/import/commit', { method: 'POST', body: { csv, map } }); $('#rel').innerHTML = `<div class="msg">Importados: ${r.importados.length}. Ignorados: ${r.ignorados.length}.</div>${r.ignorados.map(x => `<p class="err">Linha ${x.linha} (${esc(x.id)}): ${x.motivo}</p>`).join('')}` } catch (e) { $('#rel').innerHTML = `<p class="msg e">${e.message}</p>` } }
        } catch (e) { $('#o').innerHTML = `<p class="msg e">${e.message}</p>` }
      };
      $('#f').onchange = async e => { csv = await e.target.files[0].text(); map = null; show() }
    }
    async function cfg() {
      const P = k => can(k), L = (k, u, d) => P(k) ? api(u) : Promise.resolve(d); let ed = null, eds = null, pe = null;
      const [c, us, cs, sts, pr] = await Promise.all([L('config.gerenciar', '/config', null), L('funcionarios.gerenciar', '/users?all=1', []), L('clientes.gerenciar', '/clients?all=1', []), L('status.gerenciar', '/statuses?all=1', []), P('perfis.gerenciar') || P('funcionarios.gerenciar') ? api('/profiles') : Promise.resolve({ perfis: [], catalogo: [] })]);
      const sel = (o, v, a) => `<select ${a}>${o.map(x => `<option value="${esc(x[0])}" ${x[0] == v ? 'selected' : ''}>${esc(x[1])}</option>`).join('')}</select>`, po = pr.perfis.map(x => [x.id, x.nome]), gr = [...new Set(pr.catalogo.map(x => x.grupo))];
      let h = '<h1>Configurações</h1>';
      if (P('config.gerenciar')) h += `<div class="card"><label><input type="checkbox" id="po" style="width:auto" ${c.publicOpen ? 'checked' : ''}> Permitir abertura pública de chamados (/abrir-chamado)</label><label for="ch">Mensagem/canal quando a abertura pública estiver desligada</label><input id="ch" value="${esc(c.contactChannel)}"><b>Detecção de recorrência</b><div class="row"><div><label for="r1">Ocorrências para marcar urgente</label><input id="r1" type="number" value="${c.recurrence.threshold}"></div><div><label for="r2">Janela (dias)</label><input id="r2" type="number" value="${c.recurrence.windowDays}"></div><div><label for="r3">Similaridade (0–1)</label><input id="r3" type="number" step="0.05" value="${c.recurrence.similarity}"></div></div><b>SLA de resolução (horas corridas — valores de exemplo)</b><div class="row">${Object.entries(c.sla).map(([k, v], i) => `<div><label for="sl${i}">${esc(k)}</label><input type="number" min="0" id="sl${i}" data-sla="${esc(k)}" value="${v}"></div>`).join('')}<div><label for="sn1">Nova prioridade</label><input id="sn1"></div><div><label for="sh1">Horas</label><input id="sh1" type="number" min="0"></div></div><small>Prioridades que não estão nesta lista ficam sem SLA. Ainda não considera horário de atendimento, feriados nem pausas.</small><div class="row"><div><label for="ds">Dias para considerar um chamado parado com o desenvolvimento</label><input id="ds" type="number" min="1" value="${c.devStaleDays}"></div></div><p><button class="p" id="sv">Salvar configurações</button></p><div id="o" role="status"></div></div>`;
      if (P('perfis.gerenciar')) h += `<h2>Perfis e permissões</h2><div class="card scroll"><table><tr><th>Perfil</th><th>Permissões</th><th>Funcionários</th><th>Ações</th></tr>${pr.perfis.map(x => `<tr><td>${esc(x.nome)}${x.sistema ? ' <span class="tag">padrão</span>' : ''}${x.somenteProprioCliente ? ' <span class="tag">só o próprio cliente</span>' : ''}</td><td>${x.perms.length} de ${pr.catalogo.length}</td><td>${x.usuarios}</td><td>${x.travado ? 'Bloqueado' : `<button class="s" data-pe="${x.id}">Editar</button>${x.sistema ? '' : ` <button class="s" data-pd="${x.id}">Excluir</button>`}`}</td></tr>`).join('')}</table></div>
 <div class="card"><b id="pt">Novo perfil</b><label for="pn">Nome do perfil</label><input id="pn">${gr.map(g => `<fieldset><legend>${esc(g)}</legend>${pr.catalogo.filter(x => x.grupo == g).map(x => `<label style="font-weight:400"><input type="checkbox" data-pk="${x.k}" style="width:auto" ${can(x.k) ? '' : 'disabled'}> ${esc(x.rotulo)}</label>`).join('')}</fieldset>`).join('')}<label style="font-weight:400"><input type="checkbox" id="pc" style="width:auto"> Vê apenas os chamados do cliente vinculado ao funcionário e não vê observações internas</label><p><small>Você só pode conceder permissões que você mesmo tem.</small></p><p><button class="p" id="ps">Salvar perfil</button></p><div id="pm" role="status"></div></div>`;
      if (P('funcionarios.gerenciar')) h += `<h2>Funcionários</h2><div class="card scroll"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Cliente vinculado</th><th>Situação</th></tr>${us.map(u => `<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td>${sel(po, u.perfil, `data-u="${esc(u.email)}" data-f="perfil" aria-label="Perfil de ${esc(u.nome)}"`)}</td><td><input value="${esc(u.cliente)}" data-u="${esc(u.email)}" data-f="cliente" aria-label="Cliente vinculado de ${esc(u.nome)}"></td><td>${sel(['ativo', 'pendente', 'inativo'].map(x => [x, x]), u.status, `data-u="${esc(u.email)}" data-f="status" aria-label="Situação de ${esc(u.nome)}"`)}</td></tr>`).join('') || '<tr><td colspan="5">Nenhum funcionário cadastrado.</td></tr>'}</table></div>

      <div class="card"><b id="pt">Novo perfil</b><label for="pn">Nome do perfil</label><input id="pn">${gr.map(g => `<fieldset><legend>${esc(g)}</legend>${pr.catalogo.filter(x => x.grupo == g).map(x => `<label style="font-weight:400"><input type="checkbox" data-pk="${x.k}" style="width:auto" ${can(x.k) ? '' : 'disabled'}> ${esc(x.rotulo)}</label>`).join('')}</fieldset>`).join('')}<label style="font-weight:400"><input type="checkbox" id="pc" style="width:auto"> Vê apenas os chamados do cliente vinculado ao funcionário e não vê observações internas</label><p><small>Você só pode conceder permissões que você mesmo tem.</small></p><p><button class="p" id="ps">Salvar perfil</button></p><div id="pm" role="status"></div></div>`;
      if (P('funcionarios.gerenciar')) h += `<h2>Funcionários</h2>
      <div class="card scroll">
        <table>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th>Cliente vinculado</th>
            <th>Situação</th>
          </tr>${us.map(u => `<tr>
            <td>${esc(u.nome)}</td>
            <td>${esc(u.email)}</td>
            <td>${sel(po, u.perfil, `data-u="${esc(u.email)}" data-f="perfil" aria-label="Perfil de ${esc(u.nome)}"`)}</td><td><input value="${esc(u.cliente)}" data-u="${esc(u.email)}" data-f="cliente" aria-label="Cliente vinculado de ${esc(u.nome)}"></td>
            <td>${sel(['ativo', 'pendente', 'inativo'].map(x => [x, x]), u.status, `data-u="${esc(u.email)}" data-f="status" aria-label="Situação de ${esc(u.nome)}"`)}</td>
          </tr>`).join('') || '<tr><td colspan="5">Nenhum funcionário cadastrado.</td></tr>'}</table></div>
 <div class="card"><b>Cadastrar funcionário</b><p><small>Use o e-mail da conta Google. Quem se cadastra sozinho aparece acima como "pendente" com o perfil Cliente, sem acesso a dados, até você ajustar.</small></p><div class="row"><div><label for="un">Nome</label><input id="un"></div><div><label for="ue">E-mail Google</label><input id="ue" type="email"></div><div><label for="up">Perfil</label>${sel(po, 'atendente', 'id="up"')}</div><div><label for="uc">Cliente vinculado (perfil Cliente)</label><input id="uc"></div></div><p><button class="p" id="ua">Cadastrar funcionário</button></p><div id="uo" role="status"></div></div>`;
      if (P('status.gerenciar')) h += `<h2>Status</h2><div class="card scroll"><table><tr><th>Nome</th><th>Tipo</th><th>Ações</th></tr>${sts.map(x => `<tr><td>${esc(x.nome)}${x.ativo === false ? ' <span class="tag">inativo</span>' : ''}${x.demo ? ' <span class="tag">exemplo</span>' : ''}</td><td>${x.tipo == 'resolvido' ? 'Resolvido' : 'Em aberto'}</td><td><button class="s" data-se="${x.id}">Editar</button> <button class="s" data-sa="${x.id}">${x.ativo === false ? 'Reativar' : 'Inativar'}</button></td></tr>`).join('')}</table></div>
 <div class="card"><b id="stt">Cadastrar status</b><p><small>"Resolvido" conta nos indicadores de resolução e exige motivo ao encerrar ou reabrir. Mudar o tipo de um status em uso altera os indicadores dos chamados que o usam.</small></p><div class="row"><div><label for="sn">Nome</label><input id="sn"></div><div><label for="sp">Tipo</label><select id="sp"><option value="aberto">Em aberto</option><option value="resolvido">Resolvido</option></select></div></div><p><button class="p" id="ss">Salvar status</button></p><div id="so" role="status"></div></div>`;
      if (P('clientes.gerenciar')) h += `<h2>Clientes</h2><div class="card scroll"><table><tr><th>Nome</th><th>Contato</th><th>WhatsApp</th><th>Ações</th></tr>${cs.map(x => `<tr><td>${esc(x.nome)}${x.ativo === false ? ' <span class="tag">inativo</span>' : ''}</td><td>${esc(x.contato)} ${esc(x.email)}</td><td>${esc(x.whatsapp)}</td><td><button class="s" data-e="${x.id}">Editar</button> <button class="s" data-a="${x.id}">${x.ativo === false ? 'Reativar' : 'Inativar'}</button></td></tr>`).join('') || '<tr><td colspan="4">Nenhum cliente cadastrado.</td></tr>'}</table></div>
 <div class="card"><b id="ct">Cadastrar cliente</b><div class="row"><div><label for="cn">Nome</label><input id="cn"></div><div><label for="cc">Contato</label><input id="cc"></div><div><label for="ce">E-mail</label><input id="ce" type="email"></div><div><label for="cw">WhatsApp (com DDD)</label><input id="cw" inputmode="tel"></div></div><p><button class="p" id="cs">Salvar cliente</button></p><div id="co" role="status"></div></div>`;
      M.innerHTML = h; const say = (id, m, e) => { const n = $(id); if (n) n.innerHTML = `<p class="msg ${e ? 'e' : ''}">${esc(m)}</p>` }, go = (f, id) => async () => { try { await f(); cfg() } catch (e) { say(id, e.message, 1) } };
      if ($('#sv')) $('#sv').onclick = async () => { try { await api('/config', { method: 'PUT', body: { sla: (() => { const o = {}; M.querySelectorAll('[data-sla]').forEach(x => o[x.dataset.sla] = x.value); if ($('#sn1').value.trim() && $('#sh1').value) o[$('#sn1').value.trim()] = $('#sh1').value; return o })(), devStaleDays: $('#ds').value, publicOpen: $('#po').checked, contactChannel: $('#ch').value, recurrence: { threshold: $('#r1').value, windowDays: $('#r2').value, similarity: $('#r3').value } } }); say('#o', 'Configurações salvas.') } catch (e) { say('#o', e.message, 1) } };
      M.querySelectorAll('[data-u]').forEach(x => x.onchange = async () => { try { await api('/users/' + encodeURIComponent(x.dataset.u), { method: 'PATCH', body: { [x.dataset.f]: x.value } }); say('#uo', 'Funcionário atualizado.') } catch (e) { say('#uo', e.message, 1); } });
      if ($('#ua')) $('#ua').onclick = go(() => api('/users', { method: 'POST', body: { nome: $('#un').value, email: $('#ue').value, perfil: $('#up').value, cliente: $('#uc').value } }), '#uo');
      if ($('#ss')) $('#ss').onclick = go(() => { const b = { nome: $('#sn').value, tipo: $('#sp').value }; return eds ? api('/statuses/' + eds.id, { method: 'PATCH', body: b }) : api('/statuses', { method: 'POST', body: b }) }, '#so');
      if ($('#cs')) $('#cs').onclick = go(() => { const b = { nome: $('#cn').value, contato: $('#cc').value, email: $('#ce').value, whatsapp: $('#cw').value }; return ed ? api('/clients/' + ed.id, { method: 'PATCH', body: b }) : api('/clients', { method: 'POST', body: b }) }, '#co');
      if ($('#ps')) $('#ps').onclick = go(() => { const b = { nome: $('#pn').value, perms: [...M.querySelectorAll('[data-pk]:checked')].map(x => x.dataset.pk), somenteProprioCliente: $('#pc').checked }; return pe ? api('/profiles/' + pe.id, { method: 'PATCH', body: b }) : api('/profiles', { method: 'POST', body: b }) }, '#pm');
      M.onclick = e => {
        const d = e.target.dataset;
        if (d.pe) { pe = pr.perfis.find(x => x.id == d.pe); $('#pt').textContent = 'Editar perfil: ' + pe.nome; $('#pn').value = pe.nome; $('#pc').checked = !!pe.somenteProprioCliente; M.querySelectorAll('[data-pk]').forEach(x => x.checked = pe.perms.includes(x.dataset.pk)); $('#pn').focus() }
        if (d.pd && confirm('Excluir este perfil?')) api('/profiles/' + d.pd, { method: 'DELETE' }).then(cfg).catch(e => say('#pm', e.message, 1));
        if (d.se) { eds = sts.find(x => x.id == d.se); $('#stt').textContent = 'Editar status'; $('#sn').value = eds.nome; $('#sp').value = eds.tipo; $('#sn').focus() }
        if (d.sa) { const x = sts.find(y => y.id == d.sa); api('/statuses/' + x.id, { method: 'PATCH', body: { ativo: x.ativo === false } }).then(cfg).catch(e => say('#so', e.message, 1)) }
        if (d.e) { ed = cs.find(x => x.id == d.e); $('#ct').textContent = 'Editar cliente'; $('#cn').value = ed.nome; $('#cc').value = ed.contato; $('#ce').value = ed.email; $('#cw').value = ed.whatsapp; $('#cn').focus() }
        if (d.a) { const x = cs.find(y => y.id == d.a); api('/clients/' + x.id, { method: 'PATCH', body: { ativo: x.ativo === false } }).then(cfg) }
      }
    }
    boot(); if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>

</html>
